name: SofaStream CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: sofastream-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Скачивание кода репозитория
        uses: actions/checkout@v4

      - name: Установка .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Установка закреплённых зависимостей
        run: npm ci

      - name: Установка браузера и системных библиотек
        run: npx playwright install --with-deps chromium

      - name: Полная проверка теми же командами, что локально
        run: npm run check:full

      - name: Сохранение результатов и диагностики
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sofastream-checks
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn
